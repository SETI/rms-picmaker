[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-picmaker"
dynamic = ["version"]
description = "Convert PDS3, VICAR, and FITS astronomy images to JPEG, TIFF, and other display formats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.2.0",
  "numpy>=2.4.4",
  "pillow>=12.2.0",
  "scipy>=1.17.1",
  "rms-pdsparser>=2.0.0",
  "rms-tabulation>=2.0.0",
  "rms-vicar>=1.2.1",
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = [
  "astronomy",
  "PDS3",
  "VICAR",
  "FITS",
  "imaging",
  "image conversion",
  "JPEG",
  "TIFF",
  "planetary science",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-picmaker"
Documentation = "https://rms-picmaker.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-picmaker"
Source = "https://github.com/SETI/rms-picmaker"
Issues = "https://github.com/SETI/rms-picmaker/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# TODO Update desired parallelism
addopts = ["-n", "auto", "--cov=picmaker", "--strict-markers", "--strict-config"]
markers = []
# Surface unexpected runtime warnings as test failures. Add targeted
# `ignore::` entries only for warnings whose remediation lives in a
# separate planned change.
filterwarnings = [
  "error",
  # Pillow 12 deprecates Image.Image.getdata() ahead of removal in
  # Pillow 14 (2027-10-15). Migration to get_flattened_data() touches
  # pil_utils.py and the snapshot fixtures; tracked in
  # https://github.com/SETI/rms-picmaker/issues/9.
  "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
  # Astropy warns at import time when XDG_CONFIG_HOME is set but
  # ~/.astropy/config already exists. On GitHub-hosted runners the
  # warning fires only in workers that lose a TOCTOU race against the
  # config-dir-creation step in astropy init, so xdist sees different
  # tests collected per worker and aborts. Ignoring it is safe — the
  # warning is purely informational about astropy's own config path.
  "ignore:XDG_CONFIG_HOME is set:UserWarning",
  # python-dateutil 2.x uses datetime.utcfromtimestamp() which was
  # deprecated in Python 3.12.  This fires during boto3 import (pulled
  # in by the pdsparser → filecache → boto3 dependency chain) and is
  # not actionable from this codebase.
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picmaker" = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/picmaker/_version.py"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "mypy>=1.0",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  "bandit[toml]>=1.8",
  "pyroma>=4.2",
  "vulture>=2.14",
  # Self-reference: distribution name is rms-picmaker (import package is picmaker).
  "rms-picmaker[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

[project.scripts]
picmaker = "picmaker.main:main"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
source = ["picmaker"]
omit = ["tests/*", "_version.py", "*/picmaker.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 90

[tool.mypy]
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# The picmaker source (src/picmaker) is intentionally untyped and permanently
# excluded from mypy: `follow_imports = skip` stops mypy from analyzing it and
# treats it as `Any` wherever the tests import it, so tests are never flagged
# for calling into untyped code. `ignore_errors` covers the case where src is
# still passed to mypy explicitly.
module = ["picmaker", "picmaker.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# The tests legitimately call into the untyped picmaker package; don't flag
# those calls. This keeps mypy on tests green regardless of whether src is
# analyzed (e.g. if it is passed explicitly on the command line).
module = ["tests", "tests.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "picmaker._version"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "astropy.*",
  "PIL.*",
  "scipy.*",
  "vicar",
  "pdsparser",
  "pdslogger",
  "tabulation",
]
ignore_missing_imports = true


[tool.ruff]
target-version = "py311"
line-length = 90
exclude = [
#  "TODO"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
# RUF005 - `(2,) + shape` concatenation is intentional; never rewrite it.
# N801 - instrument class names (HST_ACS, HST_WFC3, ...) intentionally use
#        underscores rather than CapWords.
# E741 - single-letter names like `l` are used intentionally in this codebase.
# UP015 - explicit open() 'r' mode is kept for readability.
# RUF012 - class-level lookup dicts are shared constants, not instance
#          defaults; ClassVar annotations add no value here.
# SIM910 - explicit `dict.get(key, None)` is kept for clarity.
extend-ignore = ["PT011", "SIM105", "SIM108", "RUF005", "N801", "E741", "UP015", "RUF012",
                 "SIM910"]

[tool.ruff.lint.per-file-ignores]
# `filter` is the public keyword-argument / option name here; keep it despite
# shadowing the builtin (the builtin is not used in this module).
"src/picmaker/processing.py" = ["A001", "A002"]
# The TFIELDS check reads more clearly as an explicit `if ...: return False`.
"src/picmaker/instruments/_fits_support.py" = ["SIM103"]
# The per-filter tint chain keeps one `elif` per filter for readability rather
# than merging same-valued branches with `or`.
"src/picmaker/instruments/cassini_iss.py" = ["SIM114"]
# The explicit `for` loop over patterns is kept over an `any(...)` generator.
"src/picmaker/control.py" = ["SIM110"]


[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
targets = ["src"]
# Pickle scanning is intentional: read_one_image_array accepts pickle inputs
# as a documented (and README-warned) fallback format. The library doesn't
# unpickle anything by itself.
skips = ["B301", "B403"]

[tool.vulture]
paths = ["src"]
exclude = ["tests/"]
min_confidence = 70
