[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-picmaker"
dynamic = ["version"]
description = "Convert PDS3, VICAR, and FITS astronomy images to JPEG, TIFF, and other display formats."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astropy>=7.2.0",
  "numpy>=2.4.4",
  "pillow>=12.2.0",
  "scipy>=1.17.1",
  "rms-pdsparser>=2.0.0",
  "rms-tabulation>=2.0.0",
  "rms-vicar>=1.2.1",
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = [
  "astronomy",
  "PDS3",
  "VICAR",
  "FITS",
  "imaging",
  "image conversion",
  "JPEG",
  "TIFF",
  "planetary science",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-picmaker"
Documentation = "https://rms-picmaker.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-picmaker"
Source = "https://github.com/SETI/rms-picmaker"
Issues = "https://github.com/SETI/rms-picmaker/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# TODO Update desired parallelism
addopts = ["-n", "auto", "--cov=picmaker", "--strict-markers", "--strict-config"]
markers = []

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picmaker" = ["py.typed"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/picmaker/_version.py"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "mypy>=1.0",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  # "bandit[toml]>=1.8",
  "pyroma>=4.2",
  # "vulture>=2.14",
  # Self-reference: distribution name is rms-picmaker (import package is picmaker).
  "rms-picmaker[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

[project.scripts]
picmaker = "picmaker.cli:main"

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
source = ["picmaker"]
omit = ["tests/*", "_version.py", "*/picmaker.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
fail_under = 0

[tool.mypy]
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "picmaker._version"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "astropy.*",
  "PIL.*",
  "scipy.*",
  "vicar",
  "pdsparser",
  "tabulation",
]
ignore_missing_imports = true

# Legacy 2009-era modules — not type-annotated yet. Their public functions
# are wrapped at the picmaker.io / picmaker.pil_utils boundary so the typed
# code only sees `Any`.
[[tool.mypy.overrides]]
module = ["picmaker.tiff16", "picmaker.colornames"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = [
  "no-untyped-def",
  "no-untyped-call",
  "var-annotated",
  "assignment",
  "attr-defined",
]

# Tests are not held to the same strictness as library code. Pytest test
# functions are conventionally written without return annotations, and
# subprocess-driven tests don't care about CompletedProcess generics.
# Module names match the bare filename (e.g. ``test_io``) because the
# ``tests/`` directory is not a Python package.
[[tool.mypy.overrides]]
module = [
  "test_*",
  "conftest",
  "snapshots_index",
  "generate_snapshots",
  "regenerate_all",
  "*.recipe",
]
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
#  "TODO"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
extend-ignore = ["PT011", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# `filter` shadows the builtin in cli.py and pipeline.py — preserved for BC
# (picmaker's images_to_pics has used `filter` as a kwarg name since v1).
# `arrayRGB`, `arraysRGB`, `panelsRGB`, `quadsRGB` are preserved camelCase
# names from the legacy API; renaming them would break BC for callers that
# import these helpers from `picmaker.picmaker`.
"src/picmaker/cli.py" = ["A002", "SIM102"]
# RUF005 = `(N,) + shape` vs `(N, *shape)` — both legal, the former is the
# legacy idiom and produces byte-identical numpy arrays.
"src/picmaker/pipeline.py" = ["A002", "N806", "RUF005"]
"src/picmaker/geometry.py" = ["N806", "SIM102"]
"src/picmaker/io.py" = ["RUF005"]
# tiff16.py is legacy 2009-era code (PascalCase function names, one-line
# if/elif chains, non-context-manager `open()`). Modernization is out of
# scope for PR 3.
"src/picmaker/tiff16.py" = [
  "E701", "N802", "N806", "E501", "E711", "W291", "W293", "SIM115",
]
# colornames.py is auto-generated legacy data; keep `ColorNames` class name.
"src/picmaker/colornames.py" = [
  "E701", "E711", "N801", "W291", "W293",
  "A001",   # `tuple` is a parameter name in a tight helper
  "RUF012", # ColorNames class-level dicts are intentional
  "SIM102",
]
# Tests import legacy camelCase names for BC verification.
"tests/test_*.py" = ["N806"]

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

