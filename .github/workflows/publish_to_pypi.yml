name: Publish to PyPI
run-name: Publish to PyPI triggered by ${{ github.ref_type }} ${{ github.ref_name }}

on:
  release:
    types: [published]

jobs:
  upload_pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          # Build on the lowest supported Python version so no 3.12-only
          # syntax slips into the wheel.
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install --upgrade build && python -m build

      - name: Validate package
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC trusted publisher — no `password` line.
        # Configure the publisher at
        # https://pypi.org/manage/project/rms-picmaker/settings/publishing/
        # (see RELEASING.md for the one-time setup).
