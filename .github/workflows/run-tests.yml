name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "21 11 * * 0"
  workflow_dispatch:

jobs:
  lint:
    name: Lint rms-picmaker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: |
          ruff check src tests

      # NOTE: `ruff format --check` is intentionally NOT enforced — the project
      # does not run ruff format and existing whitespace inconsistencies remain.

      - name: Mypy
        run: |
          mypy src tests

      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      - name: PyMarkdown
        run: |
          pymarkdown scan docs/ .cursor/ README.md CONTRIBUTING.md

      - name: pip-audit
        # Audit the project's declared dependencies via the pyproject
        # resolution path; the bare `pip-audit` form audits the active
        # environment (including the actions/setup-python `pip` build),
        # which adds noise unrelated to rms-picmaker's own dep graph.
        run: |
          pip-audit .

  test:
    name: Test rms-picmaker (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          python -m pytest --cov=picmaker --cov-report=xml -n auto tests

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
